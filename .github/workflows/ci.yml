name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Demo contract gate
        run: |
          workflow-contract-gate check --contract examples/contract.json examples/fixtures/good.json
          if workflow-contract-gate check --contract examples/contract.json examples/fixtures/bad.json; then
            echo "expected bad fixture to fail" >&2
            exit 1
          fi
