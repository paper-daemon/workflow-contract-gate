[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-contract-gate"
version = "1.0.0"
description = "Dependency-light contract validation for API and webhook fixtures."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "paper-daemon"}]
keywords = ["api", "webhook", "contract-testing", "automation", "ci"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
workflow-contract-gate = "workflow_contract_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
